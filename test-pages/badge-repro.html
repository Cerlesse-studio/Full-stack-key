<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>悬浮窗定位复现台 · Freebuff 扩展</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #fafafa;
    color: #18181b;
  }
  /* 用开关模拟真实站点常见的「给 body 加 transform/filter」——
     一旦祖先有 transform，后代的 position:fixed 就会相对该祖先定位，
     扩展注入的浮层就会飘到屏幕中间。 */
  body.anchored-by-transform {
    transform: translateZ(0);
    will-change: transform;
  }
  header {
    padding: 12px 20px;
    background: #18181b;
    color: #fafafa;
    font-size: 14px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  header button {
    font: inherit;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid #52525b;
    background: #27272a;
    color: #fafafa;
    cursor: pointer;
  }
  section { padding: 16px 20px; border-bottom: 1px solid #e4e4e7; }
  h2 { font-size: 14px; margin: 0 0 4px; }
  p.hint { font-size: 12px; color: #71717a; margin: 0 0 10px; }
  label { display: block; font-size: 12px; color: #52525b; margin: 8px 0 3px; }
  input {
    width: 260px; height: 32px; padding: 0 10px;
    border: 1px solid #d4d4d8; border-radius: 6px; font: inherit;
  }
  /* 场景 A：内层可滚动容器。容器滚动不会触发 window 的 scroll 事件。 */
  .scrollbox {
    height: 160px; overflow: auto; border: 1px solid #d4d4d8; border-radius: 8px;
    background: #fff; padding: 8px;
  }
  .scrollbox .spacer { height: 420px; display: flex; align-items: center; justify-content: center; color: #a1a1aa; font-size: 12px; }
  /* 场景 C：贴近视口底部的表单，悬浮窗默认向下展开会跑出屏幕 */
  .bottom-dock {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #fff; border-top: 1px solid #e4e4e7; padding: 10px 20px;
    display: flex; gap: 10px; align-items: flex-end; z-index: 5;
  }
  .bottom-dock input { width: 200px; }
  #log {
    position: fixed; right: 12px; top: 56px; width: 320px; max-height: 60vh; overflow: auto;
    background: #18181b; color: #a1a1aa; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
    padding: 8px 10px; border-radius: 8px; z-index: 6; white-space: pre-wrap;
  }
  .tall { height: 1400px; background: linear-gradient(#fff, #f4f4f5); }
</style>
</head>
<body>
  <header>
    <strong>悬浮窗定位复现台</strong>
    <button id="toggle-transform">切换 body transform</button>
    <span id="tf-state" style="font-size:12px;opacity:.75">transform: off</span>
  </header>

  <section>
    <h2>场景 A · 内层可滚动容器里的表单</h2>
    <p class="hint">滚动这个盒子（不是页面），看徽章是否还贴在输入框上。</p>
    <div class="scrollbox" id="scrollbox">
      <div class="spacer">上下滚动我 ↓</div>
      <form id="fa">
        <label for="a-user">用户名</label>
        <input id="a-user" type="text" autocomplete="username" />
        <label for="a-pass">密码</label>
        <input id="a-pass" type="password" autocomplete="current-password" />
      </form>
      <div class="spacer">我是底部占位 ↑</div>
    </div>
  </section>

  <section>
    <h2>场景 B · 页面滚动里的表单</h2>
    <p class="hint">滚动整个页面，看徽章是否跟随。</p>
    <form id="fb">
      <label for="b-user">用户名</label>
      <input id="b-user" type="text" autocomplete="username" />
      <label for="b-pass">密码</label>
      <input id="b-pass" type="password" autocomplete="current-password" />
    </form>
  </section>

  <section><div class="tall"></div></section>

  <section>
    <h2>场景 C · 贴着视口底部的表单</h2>
    <p class="hint">点密码框，看悬浮窗是否整个跑出屏幕外、点不到也关不掉。</p>
  </section>

  <div class="bottom-dock">
    <div>
      <label for="c-user">用户名</label>
      <input id="c-user" type="text" autocomplete="username" />
    </div>
    <div>
      <label for="c-pass">密码</label>
      <input id="c-pass" type="password" autocomplete="current-password" />
    </div>
  </div>

  <div id="log"></div>

<script>
  const logEl = document.getElementById('log');
  window.__log = [];
  function log(m) {
    window.__log.push(m);
    logEl.textContent = window.__log.slice(-14).join('\n');
  }
  log('page ready');

  document.getElementById('toggle-transform').addEventListener('click', () => {
    document.body.classList.toggle('anchored-by-transform');
    const on = document.body.classList.contains('anchored-by-transform');
    document.getElementById('tf-state').textContent = 'transform: ' + (on ? 'on' : 'off');
    log('body transform ' + (on ? 'ON —— position:fixed 会被困在 body 里' : 'OFF'));
  });
</script>
</body>
</html>
